name: PointBlock Vite CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'assets/game.js'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.mjs'
      - '.github/workflows/vite.yml'
      - '.github/workflows/bot-ai-m0.yml'
      - '.github/workflows/bot-ai-m7-browser.yml'
      - '.github/workflows/online-frontend-build.yml'
      - '.github/workflows/pointblock-gunplay-windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'assets/game.js'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.mjs'
      - '.github/workflows/vite.yml'
      - '.github/workflows/bot-ai-m0.yml'
      - '.github/workflows/bot-ai-m7-browser.yml'
      - '.github/workflows/online-frontend-build.yml'
      - '.github/workflows/pointblock-gunplay-windows.yml'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Preserve canonical LF endings on Windows runner
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Vite and Three.js
        run: npm install --no-audit --no-fund
      - name: Regression tests and legacy bundle parity
        run: npm run test:ci
      - name: Production build
        run: npm run build
      - name: Validate production artifacts
        run: npm run check:dist
