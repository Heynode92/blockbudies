name: PointBlock Vite CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Vite and Three.js
        run: npm install --no-audit --no-fund
      - name: Regression tests and legacy bundle parity
        run: npm test
      - name: Production build
        run: npm run build
      - name: Validate production artifacts
        run: npm run check:dist
