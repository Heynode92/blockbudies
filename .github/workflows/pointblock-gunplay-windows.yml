name: PointBlock Gunplay Contract (Windows)

on:
  pull_request:
    paths:
      - 'src/game/**'
      - 'tests/gunplay-ballistics.test.mjs'
      - 'tests/authoritative-recoil.test.mjs'
      - 'tests/online-tracer-world-speed.test.mjs'
      - 'tests/online-movement-prediction.test.mjs'
      - 'tests/muzzle-sockets.test.mjs'
      - 'tests/shotgun-horizontal-pattern.test.mjs'
      - 'assets/game.js'
      - 'tools/source-manifest.json'
      - '.github/workflows/pointblock-gunplay-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gunplay:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify checked-in bundle matches source
        run: node tools/build.mjs --check
      - name: Authoritative recoil, muzzle, shotgun and firing security contract
        run: node --test tests/gunplay-ballistics.test.mjs tests/authoritative-recoil.test.mjs tests/shotgun-horizontal-pattern.test.mjs tests/muzzle-sockets.test.mjs tests/online-tracer-world-speed.test.mjs
      - name: Build production Vite game
        run: npm run build
      - name: Verify generated distributable
        run: npm run check:dist
