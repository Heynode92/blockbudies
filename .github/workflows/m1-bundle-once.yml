# Temporary, main-branch-only source-of-truth builder for the M1 offline bundle.
# The canonical Node build never changes game rules; write access is limited to this job.
# Rebuild after threat-knowledge fix; then remove this one-shot workflow.
name: M1 standalone bundle sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-bundle-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve canonical LF output
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Build committed standalone bundle
        shell: pwsh
        run: node tools/build.mjs
      - name: Push canonical build artifact only
        shell: pwsh
        run: |
          git add -- assets/game.js
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(bot-m1): sync standalone offline browser bundle"
            git push origin HEAD:main
          } elseif ($LASTEXITCODE -eq 0) {
            Write-Output "Standalone bundle already synchronized"
          } else {
            throw "git diff failed"
          }
