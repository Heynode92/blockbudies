# One-shot Windows canonical bundle rebuild; remove after verification.
name: M1 standalone bundle sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-bundle-once.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical standalone script rebuild
        shell: pwsh
        run: |
          node tools/build.mjs
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
      - name: Commit only the generated game bundle
        shell: pwsh
        run: |
          git add -- assets/game.js
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(bot-m1): synchronize offline bundle with final M1 source"
            if ($LASTEXITCODE -ne 0) { throw "Commit failed" }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "Push failed" }
          } elseif ($LASTEXITCODE -eq 0) {
            Write-Output "Bundle already synchronized"
          } else {
            throw "git diff failed"
          }
